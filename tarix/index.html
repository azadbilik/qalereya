    atSource: 'В источнике', commons: 'Страница на Викискладе', wikidata: 'Викиданные', full: 'Полный размер', share: 'Поделиться', copied: 'Ссылка скопирована', undated: 'Без даты', bce: 'до н. э.',
    noImgProtected: 'Изображение здесь не показано: действует авторское право (автор умер после 1955 года или работа создана позже). Смотрите у источника.', noImgLicence: 'Изображение не под свободной лицензией. Смотрите у источника.', noImgNone: 'У записи нет изображения. Смотрите у источника.', nc: 'Некоммерческая лицензия — изображение не сохраняется.' },
  en: { doc: 'Azerbaijani art · Azad Bilik', title: 'Art', gallery: 'Gallery', h1: 'Azerbaijani art',
    lead: 'From the rock art of Gobustan to today: a catalogue assembled from museums\' open data and Wikimedia Commons. A picture is shown only for works that are freely licensed and out of copyright; the rest link to where they are held.',
    miniatures: 'Miniatures for Nizami and Fuzuli', maps: 'Literary maps', atlas: 'Atlas', music: 'Music', library: 'Library', timeline: 'Timeline',
    search: 'Search…', medium: 'Kind', allM: 'All kinds', place: 'Place', allPl: 'All places', museum: 'Source', allI: 'All museums', picOnly: 'With picture only', reset: 'Reset', allP: 'All',
    count: (n, k) => `${n} work${n === 1 ? '' : 's'}${k != null ? ` · ${k} with a picture` : ''}`, empty: 'Nothing matches.', showAll: (n) => `Show all (${n})`, noPic: 'No picture', nopicFree: 'Picture not shown',
    footer: 'Every entry links to the museum\'s or Commons\' own page. Pictures of works by authors who died after 1955 (copyright in Azerbaijan runs for life plus 70 years) are not shown. Screen-sized copies are kept here, the originals at the source.', sources: 'Sources and licences',
    item: 'Work', prev: 'Previous', next: 'Next', close: 'Close', loading: 'Loading…', date: 'Date', artist: 'Maker', medium2: 'Kind', place2: 'Place', held: 'Held by', inv: 'Inventory no.', licence: 'Licence', credit: 'Photo / credit', mat: 'Medium', period: 'Period',
    atSource: 'At the source', commons: 'Commons page', wikidata: 'Wikidata', full: 'Full size', share: 'Share', copied: 'Link copied', undated: 'Undated', bce: 'BCE',
    noImgProtected: 'The picture is not shown here: the work is in copyright (its author died after 1955 or it was made later). See it at the source.', noImgLicence: 'The picture is not under a free licence. See it at the source.', noImgNone: 'This entry has no picture. See the source.', nc: 'Non-commercial licence — picture not kept.' },
};
const PERIOD_INTRO = {
  prehistory: { az: 'Qobustan, Gəmiqaya və mağara düşərgələri: qayaüstü rəsmlər, daş alətlər, ilk bəzəklər.', ru: 'Гобустан, Гямигая и пещерные стоянки: наскальные рисунки, каменные орудия, первые украшения.', en: 'Gobustan, Gamigaya and the cave sites: rock engravings, stone tools, the first ornaments.' },
  'bronze-iron': { az: 'Kür-Araz mədəniyyəti, Xocalı-Gədəbəy mədəniyyəti, Mingəçevir və Naxçıvan tapıntıları.', ru: 'Куро-аракская культура, ходжалы-кедабекская культура, находки Мингечевира и Нахчывана.', en: 'The Kura–Araxes and Khojaly–Gadabay cultures, the finds of Mingachevir and Nakhchivan.' },
  antiquity: { az: 'Qafqaz Albaniyası, antik şəhərlər, Sasani dövrü; Kiş və Qəbələ tapıntıları.', ru: 'Кавказская Албания, античные города, сасанидская эпоха; находки Киша и Габалы.', en: 'Caucasian Albania, ancient towns, the Sasanian era; the finds of Kish and Gabala.' },
  medieval: { az: 'Şirvanşahlar sarayı və daş oymaçılığı, Bərdə, Gəncə və Beyləqan keramikası, Məsumə və Mömünə xatun, Elxani və Cəlairi Təbrizi.', ru: 'Дворец Ширваншахов и резьба по камню, керамика Барды, Гянджи и Бейлагана, Ильханидский и Джалаиридский Тебриз.', en: 'The Shirvanshahs\' palace and stone carving, ceramics of Barda, Ganja and Beylagan, Ilkhanid and Jalayirid Tabriz.' },
  'early-modern': { az: 'Təbriz məktəbi və Səfəvilər, xanlıqlar dövrünün xalçası, metal və parçası.', ru: 'Тебризская школа и Сефевиды, ковры, металл и ткани эпохи ханств.', en: 'The Tabriz school and the Safavids; carpets, metal and textiles of the khanate era.' },
  c19: { az: 'Mir Mövsüm Nəvvab, Şuşa, Üstad Qəmbər Qarabaği, Mirzə Qədim İrəvani; Şirvan, Quba, Qarabağ xalçaları.', ru: 'Мир Мовсум Навваб, Шуша, Уста Гамбар Карабаги, Мирза Кадим Иревани; ковры Ширвана, Губы, Карабаха.', en: 'Mir Mohsun Navvab, Shusha, Usta Gambar Garabaghi, Mirza Gadim Iravani; the carpets of Shirvan, Guba, Karabakh.' },
  c20: { az: 'Əzim Əzimzadə, Bəhruz Kəngərli, Səttar Bəhlulzadə, Tahir Salahov, Toğrul Nərimanbəyov, Mikayıl Abdullayev, Cavad Mircavadov.', ru: 'Азим Азимзаде, Бахруз Кенгерли, Саттар Бахлулзаде, Таир Салахов, Тогрул Наримбеков, Микаил Абдуллаев, Джавад Мирджавадов.', en: 'Azim Azimzade, Bahruz Kangarli, Sattar Bahlulzade, Tahir Salahov, Togrul Narimanbekov, Mikayil Abdullayev, Javad Mirjavadov.' },
  contemporary: { az: '1991-dən bəri: müstəqil Azərbaycanın rəssamları, diaspor və beynəlxalq sərgilər.', ru: 'С 1991 года: художники независимого Азербайджана, диаспора и международные выставки.', en: 'Since 1991: artists of independent Azerbaijan, the diaspora and international shows.' },
};
const t = (k) => T[lang][k];
const KX = () => `https://kitabxana.az${lang === 'az' ? '' : '/' + lang}`;
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u; });
  document.getElementById('kx').href = KX();
}
applyLang();

let data, view = [], at = -1;
const state = { p: '', m: '', pl: '', inst: '', pic: false, q: '' };
const params = new URLSearchParams(location.search);
for (const k of ['p', 'm', 'pl', 'inst', 'q']) state[k] = params.get(k) ?? '';
state.pic = params.get('pic') === '1';
const SHOW = 48;
const expanded = new Set();

const pname = (p) => p[lang] ?? p.az;
const mname = (m) => (data.media[m] ?? data.media.other)[lang];
const titleOf = (x) => (x.title[lang] && lang !== 'en' ? x.title[lang] : '') || x.title.en || x.title.az || '';
const pspan = (p) => (lang === 'az' ? p.spanAz : lang === 'ru' ? p.spanRu : '') || p.span;
const yr = (y) => y < 0 ? `${-y}` : String(y);
const when = (x) => x.dateText || (x.yearStart != null ? (x.yearEnd != null && x.yearEnd !== x.yearStart ? `${yr(x.yearStart)}–${yr(x.yearEnd)}` : yr(x.yearStart)) + (x.yearEnd < 0 || x.yearStart < 0 ? ' ' + t('bce') : '') : '');
const hasPic = (x) => x.imageStatus === 'free';
const thumbOf = (x) => `thumbs/${encodeURIComponent(x.id)}.jpg`;
const largeOf = (x) => `large/${encodeURIComponent(x.id)}.jpg`;

fetch('../data/art/catalogue.json').then((r) => r.json()).then((d) => {
  data = d;
  data.byId = new Map(d.items.map((x) => [x.id, x]));
  data.items.forEach((x) => { x._s = [titleOf(x), x.title.az, x.title.en, x.artist, x.place, x.institution, x.dateText, x.medium].join(' ').toLowerCase(); });
  drawTimeline(); drawFilters(); render();
  const open = location.hash.slice(1);
  if (open && data.byId.has(decodeURIComponent(open))) show(decodeURIComponent(open));
});
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  applyLang();
  if (!data) return;
  drawTimeline(); drawFilters(); render(true);
  if (dlg.open && view[at]) show(view[at].id);
});

const FACET = { m: (x) => x.medium, pl: (x) => x.place, inst: (x) => x.institution?.replace(/ \(via .*\)$/, '') };
const passes = (x, skip) => (skip === 'p' || !state.p || x.period === state.p) && (!state.pic || hasPic(x))
  && Object.keys(FACET).every((f) => f === skip || !state[f] || FACET[f](x) === state[f])
  && (!state.q || x._s.includes(state.q.toLowerCase()));
function tally(f) { const n = {}; for (const x of data.items) if (passes(x, f)) { const v = f === 'p' ? x.period : FACET[f](x); if (v) n[v] = (n[v] ?? 0) + 1; } return n; }

function drawTimeline() {
  const n = tally('p');
  const all = data.items.filter((x) => passes(x, 'p')).length;
  const b = (id, span, name, c) => `<button type="button" data-p="${id}" aria-pressed="${state.p === id}"><span class="span">${esc(span)}</span><span class="nm">${esc(name)}<small>${c}</small></span></button>`;
  document.getElementById('tl').innerHTML = b('', '', t('allP'), all)
    + data.periods.map((p) => b(p.id, pspan(p), pname(p).split(':')[0], n[p.id] ?? 0)).join('');
  document.querySelectorAll('#tl button').forEach((x) => x.onclick = () => { state.p = x.dataset.p; drawTimeline(); drawFilters(); render(true); window.scrollTo({ top: 0 }); });
  const on = document.querySelector('#tl [aria-pressed="true"]'); const row = document.getElementById('tl');
  if (on && row.scrollWidth > row.clientWidth) row.scrollLeft = Math.max(0, on.offsetLeft - row.offsetLeft - 24);
}
const opt = (v, label, n, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label)} (${n})</option>`;
function drawFilters() {
  for (const f of Object.keys(FACET)) if (state[f] && !data.items.some((x) => (!state.p || x.period === state.p) && FACET[f](x) === state[f])) state[f] = '';
  const sel = (id, html, any) => { const s = document.getElementById(id); s.innerHTML = html; s.hidden = !any; s.onchange = () => { state[id] = s.value; drawTimeline(); drawFilters(); render(true); }; };
  const m = Object.entries(tally('m')).sort((a, b) => b[1] - a[1]);
  sel('m', `<option value="">${t('allM')}</option>` + m.map(([v, n]) => opt(v, mname(v), n, state.m)).join(''), m.length);
  const pl = Object.entries(tally('pl')).sort((a, b) => b[1] - a[1]);
  sel('pl', `<option value="">${t('allPl')}</option>` + pl.map(([v, n]) => opt(v, v, n, state.pl)).join(''), pl.length);
  const i = Object.entries(tally('inst')).sort((a, b) => b[1] - a[1]);
  sel('inst', `<option value="">${t('allI')}</option>` + i.map(([v, n]) => opt(v, v, n, state.inst)).join(''), i.length);
  const pic = document.getElementById('pic'); pic.checked = state.pic; pic.onchange = () => { state.pic = pic.checked; drawTimeline(); drawFilters(); render(true); };
  const q = document.getElementById('q'); if (q.value !== state.q) q.value = state.q;
  let tm; q.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { state.q = q.value.trim(); drawTimeline(); drawFilters(); render(true); }, 200); };
  const reset = document.getElementById('reset');
  reset.hidden = !(state.m || state.pl || state.inst || state.pic || state.q);
  reset.onclick = clearFilters;
}
function clearFilters() { state.m = state.pl = state.inst = state.q = ''; state.pic = false; document.getElementById('q').value = ''; drawTimeline(); drawFilters(); render(true); }
function keepUrl() {
  const p = new URLSearchParams();
  for (const k of ['p', 'm', 'pl', 'inst', 'q']) if (state[k]) p.set(k, state[k]);
  if (state.pic) p.set('pic', '1');
  if (lang !== 'az') p.set('lang', lang);
  const q = p.toString();
  history.replaceState(null, '', (q ? `?${q}` : location.pathname) + location.hash);
}

function render(fromUser) {
  if (fromUser) { keepUrl(); expanded.clear(); }
  const items = data.items.filter((x) => passes(x));
  const k = items.filter(hasPic).length;
  document.getElementById('count').textContent = t('count')(items.length, k);
  const el = document.getElementById('content');
  if (!items.length) { el.innerHTML = `<p class="empty">${t('empty')} <button type="button" class="link" id="empty-reset">${t('reset')}</button></p>`; document.getElementById('empty-reset').onclick = clearFilters; view = []; return; }
  // A chapter per period, those with a picture first, then oldest first
  const chapters = data.periods.map((p) => ({ p, items: items.filter((x) => x.period === p.id).sort((a, b) => hasPic(b) - hasPic(a) || (a.yearStart ?? 9999) - (b.yearStart ?? 9999)) })).filter((c) => c.items.length);
  const rest = items.filter((x) => !x.period);
  if (rest.length) chapters.push({ p: { id: '_', az: t('undated'), ru: t('undated'), en: t('undated'), span: '' }, items: rest });
  view = [];
  el.innerHTML = chapters.map((c) => {
    const shown = state.p || expanded.has(c.p.id) ? c.items : c.items.slice(0, SHOW);
    view.push(...shown);
    const intro = PERIOD_INTRO[c.p.id]?.[lang];
    const link = (c.p.id === 'medieval' || c.p.id === 'early-modern') ? ` <a href="../${lang === 'az' ? '' : '?lang=' + lang}">${esc(t('miniatures'))}</a>` : '';
    return `<section class="chapter" id="${c.p.id}"><div class="chapter-head"><span class="span">${esc(pspan(c.p))}</span><h2>${esc(pname(c.p))}</h2>${intro ? `<p>${esc(intro)}${link}</p>` : ''}</div>
      <div class="grid">${shown.map(card).join('')}</div>
      ${shown.length < c.items.length ? `<p class="more"><button type="button" class="link" data-more="${c.p.id}">${t('showAll')(c.items.length)}</button></p>` : ''}</section>`;
  }).join('');
  el.querySelectorAll('[data-more]').forEach((b) => b.onclick = () => { expanded.add(b.dataset.more); render(); });
  wire(el);
}
function card(x) {
  const meta = [when(x), x.artist || x.institution].filter(Boolean).join(' · ');
  const frame = hasPic(x)
    ? `<div class="frame"><img src="${thumbOf(x)}" alt="${esc(titleOf(x))}" loading="lazy" decoding="async"></div>`
    : `<div class="frame noimg"><span>${esc(mname(x.medium))}<br>${esc(t('noPic'))}</span></div>`;
  return `<button type="button" class="card" data-id="${esc(x.id)}" title="${esc(titleOf(x))}">${frame}<p class="t">${esc(titleOf(x))}</p><p class="m">${esc(meta)}</p></button>`;
}
function wire(el) {
  el.querySelectorAll('.card').forEach((b) => {
    b.onclick = () => show(b.dataset.id);
    const img = b.querySelector('img'); if (!img) return;
    const x = data.byId.get(b.dataset.id);
    const ok = () => { img.classList.add('ok'); img.parentElement.classList.add('ok'); };
    if (img.complete && img.naturalWidth) { ok(); return; }
    img.onload = ok;
    // Our copy failed: try the larger one, then the host's own file; then say so and keep the card
    const tries = [largeOf(x), x.imageSrc].filter(Boolean);
    img.onerror = () => { const n = tries.shift(); if (n) { img.src = n; return; } img.onerror = null; img.parentElement.classList.add('noimg'); img.remove(); };
  });
}

const dlg = document.getElementById('viewer');
function show(id) {
  at = view.findIndex((x) => x.id === id);
  if (at < 0) { view = [data.byId.get(id)]; at = 0; }
  const x = view[at];
  const img = document.getElementById('v-img'), stage = img.parentElement, nopic = document.getElementById('v-nopic');
  if (hasPic(x)) {
    nopic.hidden = true; img.hidden = false; img.src = thumbOf(x); img.alt = titleOf(x); stage.classList.add('busy');
    const full = new Image();
    full.onload = () => { if (view[at] === x) { img.src = full.src; stage.classList.remove('busy'); } };
    full.onerror = () => { if (view[at] !== x) return; if (x.imageSrc && full.src !== x.imageSrc) full.src = x.imageSrc; else stage.classList.remove('busy'); };
    full.src = largeOf(x);
  } else {
    img.hidden = true; img.removeAttribute('src'); stage.classList.remove('busy'); nopic.hidden = false;
    nopic.textContent = x.imageStatus === 'protected' ? t('noImgProtected') : x.imageStatus === 'nc' ? t('nc') : x.license ? t('noImgLicence') : t('noImgNone');
  }
  const p = data.periods.find((q) => q.id === x.period);
  const rows = [[t('date'), esc(when(x))], [t('artist'), esc(x.artist)], [t('period'), p ? esc(pname(p).split(':')[0]) : ''], [t('medium2'), esc(mname(x.medium))], [t('mat'), esc(x.mediumText)], [t('place2'), esc(x.placeText || x.place)],
    [t('held'), esc(x.institution)], [t('inv'), esc(x.accession)], [t('credit'), esc(x.credit)]].filter(([, v]) => v);
  const lic = x.license ? `<dt>${t('licence')}</dt><dd><span class="badge${hasPic(x) ? '' : ' nc'}">${esc(x.license)}</span></dd>` : '';
  document.getElementById('v-info').innerHTML = `
    <button type="button" class="close" id="v-close" autofocus>${t('close')} ✕</button>
    <div><h2>${esc(titleOf(x))}</h2>${x.title.az && x.title.en && x.title.az !== x.title.en ? `<p class="sub">${esc(lang === 'en' ? x.title.az : x.title.en)}</p>` : ''}</div>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}${lic}</dl>
    ${x.protectedReason && x.license ? `<p class="note">${esc(t('noImgProtected'))}</p>` : ''}
    <div class="links">
      <a href="${esc(x.url)}" target="_blank" rel="noopener">${x.file && x.source === 'commons' ? esc(x.file) : t('atSource')} ↗</a>
      ${x.commonsUrl ? `<a href="${esc(x.commonsUrl)}" target="_blank" rel="noopener">${t('commons')} ↗</a>` : ''}
      ${hasPic(x) && x.imageOriginal ? `<a href="${esc(x.imageOriginal)}" target="_blank" rel="noopener">${t('full')} ↗</a>` : ''}
      <button type="button" id="v-share">${t('share')}</button>
    </div>
    <p class="pos">${at + 1} / ${view.length}</p>`;
  document.getElementById('v-close').onclick = () => dlg.close();
  document.getElementById('v-share').onclick = async (e) => {
    const url = new URL(`${lang === 'az' ? '' : '?lang=' + lang}#${encodeURIComponent(x.id)}`, location.href.split('#')[0].split('?')[0]).href;
    if (navigator.share) { try { await navigator.share({ title: titleOf(x), url }); } catch {} return; }
    try { await navigator.clipboard.writeText(url); e.target.textContent = t('copied'); } catch { prompt(t('share'), url); }
  };
  document.getElementById('v-prev').disabled = at <= 0;
  document.getElementById('v-next').disabled = at >= view.length - 1;
  if (!dlg.open) dlg.showModal();
  history.replaceState(null, '', `${location.search || location.pathname}#${encodeURIComponent(x.id)}`);
}
document.getElementById('v-prev').onclick = () => at > 0 && show(view[at - 1].id);
document.getElementById('v-next').onclick = () => at < view.length - 1 && show(view[at + 1].id);
dlg.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && at > 0) show(view[at - 1].id);
  if (e.key === 'ArrowRight' && at < view.length - 1) show(view[at + 1].id);
});
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => history.replaceState(null, '', location.search || location.pathname));
</script>
</body>
</html>
