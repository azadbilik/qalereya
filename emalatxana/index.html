<style>
  :root {
    --paper: #F4EFE6; --ink: #1A1410; --muted: #675E55; --rule: rgb(26 20 16 / .14);
    --accent: #A81E28; --panel: rgb(244 239 230 / .96); --water: #E4DCCF; --land: #F4EFE6; --frame: #E9E2D6;

    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #14100D; --ink: #F1EBE1; --muted: #A0968B; --rule: rgb(241 235 225 / .14);
      --accent: #DA5A61; --panel: rgb(20 16 13 / .95); --water: #0C0A08; --land: #1C1713; --frame: #1F1914; }
  }
  :root[data-theme="dark"] { --paper: #14100D; --ink: #F1EBE1; --muted: #A0968B; --rule: rgb(241 235 225 / .14);
      --accent: #DA5A61; --panel: rgb(20 16 13 / .95); --water: #0C0A08; --land: #1C1713; --frame: #1F1914; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 .9375rem/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 1px; text-decoration-color: var(--rule); }
  a:hover { text-decoration-color: currentColor; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .panel {
    position: fixed; top: 1rem; left: 1rem; bottom: 1rem; width: 25rem;
    display: flex; flex-direction: column;

    border: 1px solid var(--rule); border-radius: 4px;

  .head { padding: 1.25rem 1.5rem 1rem; }

  .top nav { display: flex; gap: 1rem; font-size: .8125rem; color: var(--muted); }

  .brand svg { width: 1rem; height: 1rem; }
  .star { fill: currentColor; } .gem { fill: var(--accent); }
  h1 { margin-top: 1.25rem; font: 400 1.875rem/1.1 var(--serif); letter-spacing: -.02em; }
  .sub { margin-top: .35rem; font: italic 300 1rem/1.35 var(--serif); }

  .controls { padding: 0 1.5rem 1rem; }
  .hist-label { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  .hist-label button { font-size: .75rem; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: .2em; }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 3.25rem; margin-top: .5rem; }
  .hist button { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 0; }
  .hist .bar { display: block; background: var(--ink); opacity: .22; min-height: 2px; transition: opacity .15s; }
  .hist button:hover .bar { opacity: .5; }
  .hist button[aria-pressed="true"] .bar { background: var(--accent); opacity: 1; }
  .hist-axis { display: flex; gap: 2px; margin-top: .3rem; }
  .hist-axis span { flex: 1; text-align: center; font-size: .625rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .list { flex: 1; overflow-y: auto; border-top: 1px solid var(--rule); padding: .75rem 0 1rem; overscroll-behavior: contain; }
  .list h2 { padding: .25rem 1.5rem .5rem; font: 400 1.25rem/1.2 var(--serif); letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .list h2 small { font: 400 .75rem var(--sans); color: var(--muted); white-space: nowrap; }
  .list ol { list-style: none; padding: 0; }
  .places li button { display: grid; grid-template-columns: 1fr auto; gap: .1rem 1rem; width: 100%; text-align: left; padding: .45rem 1.5rem; }
  .places li button:hover { background: var(--rule); }
  .name { font-weight: 500; }
  .meta { font-size: .8125rem; color: var(--muted); }
  .num { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .back { margin: 0 1.5rem .5rem; font-size: .8125rem; color: var(--muted); }
  .note { padding: 1rem 1.5rem 0; font-size: .75rem; color: var(--muted); }

  .ms { padding: .9rem 1.5rem 1rem; border-top: 1px solid var(--rule); }
  .ms:first-child { border-top: 0; }
  .ms h3 { font: 400 1.0625rem/1.3 var(--serif); }
  .ms .when { font-size: .8125rem; color: var(--muted); margin-top: .1rem; }
  .ms dl { display: grid; grid-template-columns: 5rem 1fr; gap: .15rem .75rem; margin-top: .5rem; font-size: .8125rem; }
  .ms dt { color: var(--muted); }
  .thumbs { display: flex; gap: .4rem; margin-top: .65rem; overflow-x: auto; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumbs a { flex: none; background: var(--frame); border-radius: 2px; }
  .thumbs img { height: 5.5rem; width: auto; display: block; border-radius: 2px; opacity: 0; transition: opacity .4s; }
  .thumbs img:not([width]) { aspect-ratio: 3 / 4; }
  .thumbs img.ok { opacity: 1; }
  .ms .go { display: inline-block; margin-top: .55rem; font-size: .8125rem; font-weight: 500; text-decoration: none; }
  .ms .go:hover { color: var(--accent); }

  .maplibregl-ctrl-attrib { font: .6875rem var(--sans); background: var(--panel) !important; color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--muted); }
  .maplibregl-ctrl-group { background: var(--panel); border: 1px solid var(--rule); box-shadow: none !important; }
  .maplibregl-ctrl-group button + button { border-top-color: var(--rule); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); } }
  :root[data-theme="dark"] .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); }

  .maplibregl-popup-content { background: var(--paper); color: var(--ink); font: .8125rem var(--sans); padding: .4rem .6rem; border-radius: 3px; box-shadow: 0 2px 12px rgb(0 0 0 / .15); }
  .maplibregl-popup-tip { display: none; }

  .thumbs button { flex: none; background: var(--frame); border-radius: 2px; padding: 0; }
  /* Legend: on the map, always in view */
  .legend { position: fixed; top: 1rem; right: 1rem; z-index: 2; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--rule); border-radius: 4px; padding: .6rem .8rem; font-size: .75rem; display: grid; gap: .35rem; max-width: 14rem; }
  .legend .sizes { display: flex; align-items: flex-end; gap: .6rem; }
  .legend .sizes span { display: grid; justify-items: center; gap: .15rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend i { display: block; border-radius: 50%; background: var(--accent); opacity: .8; border: 1px solid var(--paper); }

  @media (max-width: 48rem) {
    .legend { top: .5rem; left: .5rem; right: .5rem; max-width: none; display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .8rem; padding: .35rem .6rem; font-size: .6875rem; }
    .legend i { transform: scale(.75); }
    .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 55svh; border-radius: 12px 12px 0 0; border-bottom: 0; overflow-y: auto; overscroll-behavior: contain; }
    .head { padding: 1rem 1rem .75rem; }
    h1 { margin-top: .75rem; font-size: 1.5rem; }
    .sub { display: none; }
    .controls { padding: 0 1rem .75rem; }
    .hist { height: 2.25rem; }
    .list { flex: none; overflow: visible; }
    .list h2, .places li button, .ms { padding-inline: 1rem; }
    .back, .note { margin-inline: 1rem; padding-inline: 0; }
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom: 55svh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
let dark = window.abTheme ? abTheme.dark() : matchMedia('(prefers-color-scheme: dark)').matches;
  addEventListener('themechange', (e) => { dark = e.detail === 'dark'; }); addEventListener('themechange', () => setTimeout(() => { try { drawLegend(); } catch {} }));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX'];
const centuryOf = (y) => Math.floor((y - 1) / 100) + 1;
// One language at a time: ?lang=, else the visitor's last choice on azadbilik.org, else Azerbaijani
const LANGS = ['az', 'ru', 'en'];
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch {}
  return 'az';
})();
function plural(n, one, few, many) { const r = new Intl.PluralRules('ru').select(n); return r === 'one' ? one : r === 'few' ? few : many; }
const T = {
  az: { doc: 'Emalatxanalar · Azad Bilik', title: 'Emalatxanalar', sub: 'Nizami və Füzulinin rəsmləri harada çəkilib, 1380–1880', map: 'Xəritə', maps: 'Xəritələr', gallery: 'Qalereya', century: 'Əsr', all: 'Hamısı', allCities: 'Bütün şəhərlər',
    cent: (c) => `${ROMAN[c]} əsr`, cities: (n) => `${n} şəhər`, mss: (n) => `${n} əlyazma`, minis: (n) => `${n} miniatür`, inGallery: (n) => `${n} miniatür qalereyada`,
    legend: 'Dairə: şəhərdə çəkilmiş miniatürlər', close: 'Bağla', loading: 'Yüklənir…', prev: 'Əvvəlki', next: 'Növbəti', openGallery: 'Qalereyada aç',
    patron: 'Hami', painters: 'Rəssamlar', held: 'Saxlanılır', probable: 'ehtimal', probableTitle: 'Atribusiya ehtimaldır', museums: 'muzeylər',
    note: 'Əlyazmanın köçürüldüyü və rəsmlərinin çəkildiyi şəhər, alimlərin atribusiyasına görə. Şəhəri bilinməyən əlyazmalar (məsələn, Walters kolleksiyasının çoxu) xəritədə yoxdur.' },
  ru: { doc: 'Мастерские · Azad Bilik', title: 'Мастерские', sub: 'Где иллюстрировали Низами и Физули, 1380–1880', map: 'Карта', maps: 'Карты', gallery: 'Галерея', century: 'Век', all: 'Все', allCities: 'Все города',
    cent: (c) => `${ROMAN[c]} век`, cities: (n) => `${n} ${plural(n, 'город', 'города', 'городов')}`, mss: (n) => `${n} ${plural(n, 'рукопись', 'рукописи', 'рукописей')}`, minis: (n) => `${n} ${plural(n, 'миниатюра', 'миниатюры', 'миниатюр')}`, inGallery: (n) => `${n} ${plural(n, 'миниатюра', 'миниатюры', 'миниатюр')} в галерее`,
    legend: 'Круг: миниатюры, написанные в городе', close: 'Закрыть', loading: 'Загрузка…', prev: 'Предыдущая', next: 'Следующая', openGallery: 'Открыть в галерее',
    patron: 'Заказчик', painters: 'Художники', held: 'Хранится', probable: 'предположительно', probableTitle: 'Атрибуция предположительная', museums: 'музеи',
    note: 'Город, где рукопись переписана и проиллюстрирована, по атрибуции учёных. Рукописей, город которых неизвестен (например, большинства из собрания Уолтерса), на карте нет.' },
  en: { doc: 'Workshops · Azad Bilik', title: 'Workshops', sub: 'Where Nizami and Fuzuli were painted, 1380–1880', map: 'Map', maps: 'Maps', gallery: 'Gallery', century: 'Century', all: 'All', allCities: 'All cities',
    cent: (c) => `${c}${[, 'st', 'nd', 'rd'][c % 10 * (c % 100 > 3 && c % 100 < 21 ? 0 : 1)] ?? 'th'} century`, cities: (n) => `${n} cit${n === 1 ? 'y' : 'ies'}`, mss: (n) => `${n} manuscript${n === 1 ? '' : 's'}`, minis: (n) => `${n} miniature${n === 1 ? '' : 's'}`, inGallery: (n) => `${n} miniature${n === 1 ? '' : 's'} in the gallery`,
    legend: 'Circle: miniatures painted in the city', close: 'Close', loading: 'Loading…', prev: 'Previous', next: 'Next', openGallery: 'Open in the gallery',
    patron: 'Patron', painters: 'Painters', held: 'Held by', probable: 'probable', probableTitle: 'Attribution uncertain', museums: 'museums',
    note: 'The city where each manuscript was copied and painted, as scholars attribute it. Manuscripts of unknown city (most of the Walters ones) are not on the map.' },
};
const t = (k) => T[lang][k];
let NAMES = { places: {}, dynasties: {} };
const named = (table, en) => en ? ({ az: table[en]?.[0], ru: table[en]?.[1], en })[lang] ?? en : '';
const placeName = (p) => named(NAMES.places, p);
const dynasty = (m) => named(NAMES.dynasties, m.dynasty);
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((el) => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-label]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  drawLegend();
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u; });
}
applyLang();
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href);
  if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang);
  history.replaceState(null, '', u);
  applyLang();
  if (!manuscripts.length) return;
  for (const l of map.getStyle().layers)
    if (l.type === 'symbol' && l.layout?.['text-field'])
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']]);
  drawHistogram(); render();
});
const when = (m) => m.yearStart ? (m.yearEnd && m.yearEnd !== m.yearStart ? `${m.yearStart}–${m.yearEnd}` : String(m.yearStart)) : '';

let manuscripts = [], items = [], century = null, place = null;

const map = new maplibregl.Map({
  container: 'map',
  style: `https://tiles.openfreemap.org/styles/${dark ? 'dark' : 'positron'}`,
  bounds: [[40, 25], [75, 43]], minZoom: 2, maxZoom: 10,
  attributionControl: { compact: true, customAttribution: `<a href="https://www.wikidata.org">Wikidata</a> · ${t('museums')}` },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
const phone = () => matchMedia('(max-width: 48rem)').matches;
const pad = () => phone() ? { top: 16, right: 16, left: 16, bottom: document.querySelector('.panel').offsetHeight + 16 } : { top: 32, right: 48, bottom: 32, left: 25 * 16 + 48 };
map.once('load', () => {
  map.fitBounds([[40, 25], [75, 43]], { padding: pad(), duration: 0 });
  document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
});
map.on('style.load', () => {
  for (const l of map.getStyle().layers) {
    if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', css('--land'));
    if (l.type === 'fill' && /water|ocean|lake/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', css('--water'));
    if (l.type === 'symbol' && l.layout?.['text-field'])
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', `name:${lang}`], ['get', lang === 'ru' ? 'name' : 'name:latin'], ['get', 'name']]);
  }
});

map.on('load', async () => {
  const [cat, gallery] = await Promise.all([fetch('../data/manuscripts.json').then((r) => r.json()), fetch('../data/gallery.json').then((r) => r.json())]);
  items = gallery.items;
  NAMES = gallery.names ?? NAMES;
  const count = new Map();
  for (const x of items) if (x.ms) count.set(x.ms, (count.get(x.ms) ?? 0) + 1);
  // A workshop needs a city and a date; prints, carpets and later collectors' albums are left out
  manuscripts = cat.manuscripts
    .filter((m) => m.lat != null && m.yearStart && (!m.kind || m.kind === 'lithograph') && count.get(m.id))
    .map((m) => ({ ...m, n: count.get(m.id), century: centuryOf(m.yearStart) }));
  map.addSource('places', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'places', type: 'circle', source: 'places', paint: {
    'circle-radius': ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 1, 5, 6, 14, 12, 28],
    'circle-color': css('--accent'),
    'circle-opacity': ['case', ['get', 'dim'], .25, .8],
    'circle-stroke-color': css('--paper'), 'circle-stroke-width': ['case', ['get', 'sel'], 2.5, 1],
  } });
  map.on('mousemove', 'places', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const p = e.features[0].properties;
    tip.setLngLat(e.features[0].geometry.coordinates).setHTML(`<strong>${esc(p.name)}</strong> · ${t('minis')(p.n)}`).addTo(map);
  });
  map.on('mouseleave', 'places', () => { map.getCanvas().style.cursor = ''; tip.remove(); });
  map.on('click', 'places', (e) => select(e.features[0].properties.id));
  map.on('click', (e) => { if (!map.queryRenderedFeatures(e.point, { layers: ['places'] }).length && place) select(null); });
  drawHistogram();
  render();
});

function visible() { return manuscripts.filter((m) => century == null || m.century === century); }
function groups() {
  const g = new Map();
  for (const m of visible()) {
    if (!g.has(m.place)) g.set(m.place, { id: m.place, name: placeName(m.place), lng: m.lng, lat: m.lat, manuscripts: [], n: 0 });
    const x = g.get(m.place); x.manuscripts.push(m); x.n += m.n;
  }
  return [...g.values()].sort((a, b) => b.n - a.n);
}

function render() {
  const gs = groups();
  if (place && !gs.some((g) => g.id === place)) place = null;
  map.getSource('places').setData({ type: 'FeatureCollection', features: gs.map((g) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [g.lng, g.lat] },
    properties: { id: g.id, name: g.name, n: g.n, sel: g.id === place, dim: place != null && g.id !== place },
  })) });
  const el = document.getElementById('list');
  const sel = gs.find((g) => g.id === place);
  document.getElementById('all').hidden = century == null;
  if (sel) {
    el.innerHTML = `<button type="button" class="back" id="back">← ${t('allCities')}</button>
      <h2>${esc(sel.name)} <small>${t('mss')(sel.manuscripts.length)} · ${t('minis')(sel.n)}</small></h2>
      ${sel.manuscripts.sort((a, b) => a.yearStart - b.yearStart).map(card).join('')}`;
    document.getElementById('back').onclick = () => select(null);
    // A thumbnail opens the viewer on its manuscript's paintings, all of them, not only the eight shown
    el.querySelectorAll('[data-pic]').forEach((b) => b.onclick = () => {
      const all = items.filter((x) => x.ms === b.dataset.ms).sort((a, c) => (a.year ?? 0) - (c.year ?? 0));
      openPic(all, all.findIndex((x) => x.id === b.dataset.pic));
    });
    return;
  }
  const total = gs.reduce((s, g) => s + g.n, 0);
  el.innerHTML = `<h2>${century ? t('cent')(century) : t('allCities')} <small>${t('cities')(gs.length)} · ${t('minis')(total)}</small></h2>
    <ol class="places">${gs.map((g) => `<li><button type="button" data-id="${esc(g.id)}"><span class="name">${esc(g.name)}</span><span class="num">${g.n}</span>
      <span class="meta">${esc(g.manuscripts.sort((a, b) => b.n - a.n).slice(0, 2).map((m) => `${dynasty(m) ? dynasty(m) + ', ' : ''}${when(m)}`).join(' · '))}${g.manuscripts.length > 2 ? '…' : ''}</span></button></li>`).join('')}</ol>
    <p class="note">${t('note')}</p>`;
  el.querySelectorAll('button[data-id]').forEach((b) => b.onclick = () => select(b.dataset.id));
}

// A manuscript: when, for whom, by whom, where it is now, and its paintings in the gallery
function card(m) {
  const own = items.filter((x) => x.ms === m.id).sort((a, b) => (a.year ?? 0) - (b.year ?? 0));
  const q = lang === 'az' ? '' : `lang=${lang}`;
  const href = m.single ? `../${q ? '?' + q : ''}#${encodeURIComponent(own[0]?.id ?? '')}` : `../?ms=${encodeURIComponent(own.find((x) => x.manuscript)?.manuscript ?? m.label)}${q ? '&' + q : ''}`;
  const rows = [[t('patron'), m.patron], [t('painters'), m.painters?.join(', ')], [t('held'), m.holding]].filter(([, v]) => v);
  return `<section class="ms"><h3>${esc(m.title || m.label)}</h3>
    <p class="when">${esc([when(m), dynasty(m)].filter(Boolean).join(' · '))}${m.confidence !== 'high' ? ` · <span title="${t('probableTitle')}">${t('probable')}</span>` : ''}</p>
    ${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
    <div class="thumbs">${own.slice(0, 8).map((x) => `<button type="button" data-ms="${esc(m.id)}" data-pic="${esc(x.id)}" title="${esc(x.title)}"><img src="${esc(src(x.thumb))}"${x.w ? ` width="${x.w}" height="${x.h}"` : ''} alt="${esc(x.title)}" loading="lazy" referrerpolicy="no-referrer" onload="this.classList.add('ok')" onerror="this.parentElement.remove()"></button>`).join('')}</div>
    <a class="go" href="${href}">${t('inGallery')(own.length)} →</a></section>`;
}

const src = (u) => /^(thumbs|large)\//.test(u) ? '../' + u : u;

// A miniature opens in the hub's viewer (/shared/viewer.js), the rest of its manuscript beside it
function openPic(list, i) {
  const q = lang === 'az' ? '' : `?lang=${lang}`;
  AzadViewer.open(list, i, {
    src: (x) => src(x.thumb), full: (x) => x.large && src(x.large), fallback: (x) => x.image, alt: (x) => x.title,
    labels: { close: t('close'), prev: t('prev'), next: t('next'), loading: t('loading') },
    info: (x) => `<h2>${esc(x.title)}</h2>
      <p class="m">${[x.when ?? x.date, x.manuscript, x.museum].filter(Boolean).map(esc).join('<br>')}</p>
      <p><a href="../${q}#${encodeURIComponent(x.id)}">${t('openGallery')} →</a></p>`,
  });
}

// Circle sizes as the map draws them (radius by the square root of the count)
function drawLegend() {
  const r = (n) => { const q = Math.sqrt(n); return q <= 6 ? 5 + (q - 1) / 5 * 9 : 14 + (q - 6) / 6 * 14; };
  document.getElementById('legend').innerHTML = `<span>${t('legend')}</span><div class="sizes">${[5, 25, 100].map((n) => `<span><i style="width:${2 * r(n)}px;height:${2 * r(n)}px"></i>${n}</span>`).join('')}</div>`;
}

function select(id) {
  place = id;
  render();
  const g = groups().find((x) => x.id === id);
  if (g) map.easeTo({ center: [g.lng, g.lat], zoom: Math.max(map.getZoom(), 5), padding: pad(), duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600 });
  document.getElementById('list').scrollTop = 0;
}

function drawHistogram() {
  const cs = manuscripts.map((m) => m.century);
  const range = Array.from({ length: Math.max(...cs) - Math.min(...cs) + 1 }, (_, i) => Math.min(...cs) + i);
  const count = (c) => manuscripts.filter((m) => m.century === c).reduce((s, m) => s + m.n, 0);
  const max = Math.max(...range.map(count));
  const hist = document.getElementById('hist');
  hist.innerHTML = range.map((c) => `<button type="button" data-c="${c}" aria-pressed="${century === c}" aria-label="${t('cent')(c)}: ${count(c)}" title="${t('cent')(c)} · ${count(c)}"><span class="bar" style="height:${Math.sqrt(count(c) / max) * 100}%"></span></button>`).join('');
  document.getElementById('axis').innerHTML = range.map((c) => `<span>${ROMAN[c]}</span>`).join('');
  hist.querySelectorAll('button').forEach((b) => b.onclick = () => { const c = +b.dataset.c; century = century === c ? null : c; place = null; drawHistogram(); render(); });
}
document.getElementById('all').onclick = () => { century = null; drawHistogram(); render(); };
</script>
</body>
</html>
