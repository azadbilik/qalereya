    more: (k) => `Show all (${k})`, less: 'Show fewer',
    methodH: 'How it is built',
    method: (s) => `<ul><li><b>Painters, patrons, cities:</b> from <code>data/manuscripts.json</code>, a catalogue kept by hand; each entry carries sources and a confidence. Of ${s.manuscripts} manuscripts and objects, those naming a painter or a patron are included. Where there is no city (a Mughal manuscript), the dynasty stands in.</li>
<li><b>One person:</b> “Bihzad (attributed)” and “Bihzad (ascribed)” are one painter, the line dashed. “Mirak” and “Aqa Mirak” are kept apart: whether they are one person has not been checked.</li>
<li><b>Working together</b> is inferred only from one manuscript's entry; there is no folio-level attribution. Most manuscripts name no painter, so the network is what the entries say, not all the painters.</li>
<li><b>Scenes that travelled:</b> from the scene catalogue (<code>data/tags</code>) and the manuscript's city. ${s.withCity} of ${s.pictures} miniatures have a known city; the rest are left out. The year is the start of the manuscript's dating.</li></ul>`,
    foot: (d) => `Data: the gallery, ${d}. File: <a href="../data/network.json">network.json</a>. Miniatures are from museums' open collections. Catalogue CC0.` },
};
const t = (k) => T[lang][k];
let net = null, view = 'people', sel = null, all = false, G = null, gv = null, cur = null;
const stage = document.getElementById('net'), info = document.getElementById('info');
const place = (n) => { const x = net.names.places[n] ?? net.names.dynasties[n]; return x ? ({ az: x[0], ru: x[1], en: n })[lang] : n; };
const dyn = (n) => { const x = net.names.dynasties[n]; return x ? ({ az: x[0], ru: x[1], en: n })[lang] : n; };
const nodeLabel = (n) => n.type === 'place' ? place(n.label) : n.type === 'scene' ? (n.s[lang] || n.s.az) : n.label;
const KIND = { painter: ['lPainter', 'circle'], ms: ['lMs', 'sq hol'], place: ['lPlace', 'dia'], patron: ['lPatron', 'tri'], scene: ['lScene', 'circle'] };
const SHAPE = { ms: 'square', place: 'diamond', patron: 'triangle' };
const COL = { painter: 'var(--accent)', ms: 'var(--ms)', place: 'var(--second)', patron: 'var(--third)', scene: 'var(--accent)' };

// Two graphs from the same data
function graph() {
  if (view === 'people') {
    const nodes = net.nodes.map((n) => ({ ...n })), by = new Map(nodes.map((n) => [n.id, n]));
    const links = net.links.map((l) => ({ ...l, source: by.get(l.source), target: by.get(l.target) }));
    for (const n of nodes) n.deg = links.filter((l) => l.source === n || l.target === n).length;
    return { nodes, links };
  }
  const nodes = [], links = [], cities = new Map();
  for (const s of net.scenes) {
    const sn = { id: s.id, type: 'scene', label: s[lang] || s.az, s, deg: s.cities.length };
    nodes.push(sn);
    for (const c of s.cities) {
      if (!cities.has(c.city)) { const cn = { id: `w:${c.city}`, type: 'place', label: c.city, deg: 0, city: true }; cities.set(c.city, cn); nodes.push(cn); }
      cities.get(c.city).deg++;
      links.push({ source: sn, target: cities.get(c.city), kind: 'scene', n: c.n, year: c.year });
    }
  }
  return { nodes, links };
}

// One graph per view: built when the view is first drawn, rebuilt only when the view changes (a language switch relabels)
function draw() {
  if (!net) return;
  if (G && gv === view) { G.setStrings(); G.relabel(); describe(cur); return; }
  G?.destroy(); sel = null;
  const g = cur = graph(); gv = view;
  const maxN = Math.max(2, ...g.links.map((l) => l.n || 1));
  // radius in px: painters, patrons and cities by their ties, a manuscript by its miniatures, a scene by its cities
  const R = (n) => n.type === 'scene' ? 3.5 + Math.sqrt(n.deg) * 1.6 : n.type === 'ms' ? 4.5 + Math.min(4.5, Math.sqrt(n.n || 1) * 0.9) : 5.5 + Math.sqrt(n.deg) * 1.7;
  G = createGraph(stage, {
    nodes: g.nodes, edges: g.links.map((l, i) => ({ ...l, id: `l${i}`, source: l.source.id, target: l.target.id })),
    layout: 'force', toggle: false, edgeClick: false, arrows: false, curve: 0.08,
    label: nodeLabel, color: (n) => COL[n.type], size: R, shape: (n) => SHAPE[n.type], hollow: (n) => n.type === 'ms',
    // painters, patrons and cities are always named; a manuscript on focus; a scene when there is room
    labelRank: (n) => n.type === 'ms' ? -1 : n.type === 'scene' ? n.deg : 100 + n.deg,
    dashed: (l) => !!l.probable, edgeColor: () => 'var(--muted)', edgeAlpha: 0.6,
    edgeWidth: (l) => view === 'scenes' ? 0.8 + 2.6 * Math.sqrt(((l.n || 1) - 1) / (maxN - 1)) : 1.3,
    fa2: view === 'scenes' ? { scalingRatio: 14 } : {},
    searchText: (n) => [n.label, n.title, n.full, n.s?.az, n.s?.ru, n.s?.en, n.type === 'place' ? n.label : ''].filter(Boolean).join(' '),
    tooltip: (n) => `<div class="tt"><b>${esc(nodeLabel(n))}</b><span>${esc(t(KIND[n.type][0]))}${n.year ? ` · ${n.year}` : ''}</span></div>`,
    panel: info,
    onSelect: (f) => { sel = f?.type === 'node' ? f.id : null; describe(g); },
  });
  describe(g);
}

const gal = (m) => `../?ms=${encodeURIComponent(m)}${lang === 'az' ? '' : `&lang=${lang}`}`;
const dl = (rows) => `<dl>${rows.filter((r) => r[1]).map(([k, v]) => `<dt>${esc(t(k))}</dt><dd>${v}</dd>`).join('')}</dl>`;
function describe(g) {
  const n = g.nodes.find((x) => x.id === sel);
  if (!n) { info.innerHTML = `<p class="empty">${esc(t('pick'))}</p>`; return; }
  const link = (x) => g.links.filter((l) => l.source === n || l.target === n).map((l) => ({ o: l.source === n ? l.target : l.source, l }));
  const head = `<div class="k">${esc(t(KIND[n.type][0]))}</div><h3>${esc(nodeLabel(n))}</h3>`;
  const msLine = (m) => `<a href="${gal(m.ms)}">${esc(m.title || m.label)}</a> <span class="muted">(${m.year ?? '?'}${m.place ? ', ' + esc(place(m.place)) : ''})</span>`;
  if (n.type === 'painter') {
    const ms = link().map(({ o, l }) => ({ ...o, probable: l.probable })).sort((a, b) => a.year - b.year);
    const peers = [...new Set(net.together.filter((p) => p.a === n.label || p.b === n.label).map((p) => (p.a === n.label ? p.b : p.a)))];
    info.innerHTML = head + dl([['ms', `<ul>${ms.map((m) => `<li>${msLine(m)}${m.probable ? ` <em>(${esc(t('probable'))})</em>` : ''}</li>`).join('')}</ul>`], ['peers', peers.map(esc).join(', ')]]);
  } else if (n.type === 'ms') {
    const rel = link();
    info.innerHTML = head + `<div class="muted">${esc(n.title)}</div>` + dl([
      ['year', `${n.year}${n.yearEnd && n.yearEnd !== n.year ? '–' + n.yearEnd : ''}`],
      ['place', [n.place && esc(place(n.place)), n.dynasty && esc(dyn(n.dynasty))].filter(Boolean).join(', ')],
      ['patron', esc(rel.filter((r) => r.o.type === 'patron').map((r) => r.o.full).join(', '))],
      ['painters', esc(rel.filter((r) => r.o.type === 'painter').map((r) => r.o.label + (r.l.probable ? ` (${t('probable')})` : '')).join(', '))],
      ['held', esc(n.holding)], ['pics', n.n ? esc(t('n')(n.n)) : ''], ['conf', esc(n.confidence)]]) + (n.n ? `<a class="go" href="${gal(n.ms)}">${esc(t('openG'))} →</a>` : '');
  } else if (n.type === 'place' || n.type === 'patron') {
    if (view === 'scenes') {
      const rel = link().map(({ o, l }) => ({ s: o.s, l })).sort((a, b) => b.l.n - a.l.n);
      info.innerHTML = head + dl([['scenes', `<ul>${rel.slice(0, 12).map(({ s, l }) => `<li>${esc(s[lang] || s.az)} <span class="muted">(${esc(t('n')(l.n))}, ${l.year})</span></li>`).join('')}</ul>${rel.length > 12 ? `<span class="muted">+ ${rel.length - 12}</span>` : ''}`]]);
    } else {
      const ms = link().map(({ o }) => o).sort((a, b) => a.year - b.year);
      info.innerHTML = head + dl([['ms', `<ul>${ms.map((m) => `<li>${msLine(m)}</li>`).join('')}</ul>`]]);
    }
  } else {
    const s = n.s;
    info.innerHTML = head + dl([['poem', esc(s.poemName[lang] || s.poemName.az)],
      ['cities', `<ul>${s.cities.map((c) => `<li>${esc(place(c.city))} <span class="muted">(${c.year}, ${esc(t('n')(c.n))})</span></li>`).join('')}</ul>`]])
      + `<a class="go" href="../?p=${encodeURIComponent(s.poem)}${lang === 'az' ? '' : `&lang=${lang}`}">${esc(t('openP'))} →</a>`;
  }
}

function legend() {
  const kinds = view === 'people' ? ['painter', 'ms', 'patron', 'place'] : ['scene', 'place'];
  document.getElementById('legend').innerHTML = kinds.map((k) => `<span><i class="${KIND[k][1]}" style="--c:${COL[k]}"></i>${esc(t(KIND[k][0]))}</span>`).join('');
}
function lists() {
  document.getElementById('s-people').hidden = view !== 'people';
  document.getElementById('s-scenes').hidden = view !== 'scenes';
  // One line per manuscript that names two or more painters
  const byMs = new Map();
  for (const l of net.links) if (l.kind === 'painted') byMs.set(l.target, [...(byMs.get(l.target) ?? []), l.source]);
  document.getElementById('pairs').innerHTML = [...byMs].filter(([, ps]) => ps.length >= 2).map(([m, ps]) => {
    const mn = net.nodes.find((n) => n.id === m), names = ps.map((id) => net.nodes.find((n) => n.id === id).label);
    return `<li><a href="${gal(mn.ms)}">${esc(mn.label)}</a> <span class="ms">(${mn.year}${mn.place ? ', ' + esc(place(mn.place)) : ''})</span><br>${names.map(esc).join(', ')}</li>`;
  }).join('');
  const rows = all ? net.scenes : net.scenes.slice(0, 12);
  document.getElementById('travels').innerHTML = rows.map((s) => `<li><span class="nm">${esc(s[lang] || s.az)}</span> <span class="poem">· ${esc(s.poemName[lang] || s.poemName.az)} · ${esc(t('nc')(s.cities.length))}</span>
    <div class="chain">${s.cities.map((c) => `<span>${esc(place(c.city))} <small>${c.year}</small></span>`).join('<span class="arr" aria-hidden="true">→</span>')}</div></li>`).join('');
  const more = document.getElementById('more');
  more.hidden = net.scenes.length <= 12;
  more.textContent = all ? t('less') : t('more')(net.scenes.length);
}
document.getElementById('more').onclick = () => { all = !all; lists(); };

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('doc');
  document.querySelectorAll('[data-i18n]').forEach((e) => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('[data-keep-lang]').forEach((a) => { const u = new URL(a.getAttribute('href'), location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); a.href = u.pathname + u.search; });
  if (!net) return;
  document.getElementById('lede').textContent = t('lede')(net.stats);
  document.getElementById('hint').textContent = t(view === 'people' ? 'hintPeople' : 'hintScenes');
  document.getElementById('method').innerHTML = t('method')(net.stats);
  document.getElementById('foot').innerHTML = t('foot')(net.built);
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === view));
  legend(); lists(); draw();
}
document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => {
  view = b.dataset.view; sel = null;
  const u = new URL(location.href); if (view === 'people') u.searchParams.delete('view'); else u.searchParams.set('view', view); history.replaceState(null, '', u);
  applyLang();
});
document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  const u = new URL(location.href); if (lang === 'az') u.searchParams.delete('lang'); else u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  applyLang();
});
if (new URLSearchParams(location.search).get('view') === 'scenes') view = 'scenes';
applyLang();
document.fonts?.ready.then(() => G?.relabel());
fetch('../data/network.json').then((r) => r.json()).then((d) => { net = d; applyLang(); });
})();
</script>
</body>
</html>
